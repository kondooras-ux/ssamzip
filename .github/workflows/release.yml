name: release
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "라이브러리 변화가 없어도 새로 배포"
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 최신 라이브러리 설치 후 버전 기록
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip freeze | grep -iE '^(pyzipper|py7zr|zopfli|tkinterdnd2|sv[-_]ttk)==' | sort > new.lock
          cat new.lock
      - name: 자체 점검
        run: python selftest.py
      - id: decide
        run: |
          python ci_bump.py check > out.txt; cat out.txt
          if grep -q "changed=true" out.txt || [ "${{ inputs.force }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 최신 라이브러리 설치
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt pyinstaller
          pip freeze | grep -iE '^(pyzipper|py7zr|zopfli|tkinterdnd2|sv[-_]ttk)==' | sort > new.lock
      - name: 자체 점검 (윈도우)
        run: python selftest.py
      - name: 버전 올리기와 변경 이력 기록
        id: bump
        shell: bash
        run: |
          python ci_bump.py apply | tee bump.txt
          VER=$(python -c "import build; print(build.read_version())")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: exe 빌드와 배포 파일 만들기
        run: python build.py --release
      - name: 변경 사항 저장
        shell: bash
        run: |
          rm -f new.lock bump.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add requirements.lock CHANGELOG.md ssamzip.py
          git commit -m "chore: 라이브러리 자동 갱신 ${{ steps.bump.outputs.version }}" || echo "변경 없음"
          git push
      - name: GitHub Release 만들기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.bump.outputs.version }}"
          gh release create "v$VER" release/ssamzip-$VER.zip release/SHA256SUMS.txt release/latest.json \
            --title "쌤ZIP $VER" --notes-file <(python -c "import build; print(build.changelog_notes('$VER'))")
